name: pages

# Publish the browser playground after a successful release.
#
# Triggered by the `release` workflow (tag push v*), not by the tag itself.
# That way the job runs in the default-branch context and satisfies the
# github-pages environment protection rules (which often block tags).
#
# Also runnable manually via workflow_dispatch (deploys the selected branch).

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # needed to inspect the triggering workflow_run

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip failed/cancelled releases; always run on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          # For workflow_run: build the exact commit that was released.
          # For workflow_dispatch: build the selected branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build WASM + Pages site
        run: make pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
