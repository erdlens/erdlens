name: pages

# After a release (or on manual run), ask erdlens.github.io to rebuild and
# publish https://erdlens.github.io
#
# Requires repo secret PAGES_REPO_TOKEN: a PAT (or fine-grained token) with
# permission to dispatch workflows on erdlens/erdlens.github.io
# (contents: read + actions: write, or classic `repo` scope).

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-trigger
  cancel-in-progress: true

jobs:
  trigger:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to erdlens.github.io
        env:
          GH_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set secret PAGES_REPO_TOKEN (PAT with access to erdlens/erdlens.github.io) so releases can update https://erdlens.github.io"
            exit 1
          fi
          REF="${{ github.event.workflow_run.head_sha || github.sha }}"
          gh api repos/erdlens/erdlens.github.io/dispatches --input - <<EOF
          {"event_type":"deploy-pages","client_payload":{"ref":"$REF"}}
          EOF
